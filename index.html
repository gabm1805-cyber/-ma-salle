<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Ma Salle</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#0b1220;color:#edf3ff;font:16px system-ui}main{max-width:650px;margin:auto;padding:18px 16px 90px}h1{font-size:25px}h2{font-size:20px}button,input,select{font:inherit}button{background:#1878f3;color:white;border:0;border-radius:12px;padding:13px;cursor:pointer}button.secondary{background:#202f45}button.danger{background:#73313b}.card{background:#152237;border:1px solid #293d56;border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>*{min-width:0}.muted{color:#9fb0c7;font-size:13px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101b2c;padding:10px;gap:8px;justify-content:center}.tabs button{flex:1;max-width:160px;padding:10px 4px}.field{background:#0c1727;border:1px solid #43516a;color:white;border-radius:8px;padding:10px;box-sizing:border-box;width:100%}.set{display:grid;grid-template-columns:35px 1fr 1fr 40px;gap:6px;margin:8px 0;align-items:center}.pill{color:#64d9a1}canvas{width:100%;height:200px}label{display:block;margin:10px 0}.wide{width:100%}
/* V3 : accueil et navigation optimisés pour iPhone */
main{padding:24px 18px calc(110px + env(safe-area-inset-bottom));}
body{font-size:17px;}
button{min-height:48px;font-weight:600;}
.card{padding:19px;border-radius:20px;}
#app:has(>h1:first-child) > h1:first-child{font-size:30px;letter-spacing:-.5px;}
/* Cartes des trois programmes uniquement sur l'accueil */
#app > .card.row:has(button[onclick^="start("]){min-height:120px;padding:22px 20px;gap:16px;margin:18px 0;box-sizing:border-box;}
#app > .card.row:has(button[onclick^="start("]) b{font-size:25px;}
#app > .card.row:has(button[onclick^="start("]) .muted{font-size:14px;line-height:1.45;margin-top:6px;}
#app > .card.row:has(button[onclick^="start("]) button{min-height:62px;min-width:118px;padding:14px 16px;font-size:16px;flex-shrink:0;}
.tabs{box-sizing:border-box;width:100%;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:7px;justify-content:space-around;border-top:1px solid #293d56;z-index:5;}
.tabs button{min-width:0;max-width:none;flex:1 1 0;min-height:58px;padding:8px 2px;font-size:clamp(11px,3.25vw,15px);border-radius:13px;white-space:nowrap;}
.tabs button.active{background:#31527e;outline:1px solid #67aaff;}
@media(max-width:380px){#app > .card.row:has(button[onclick^="start("]){padding:17px 14px;gap:9px}#app > .card.row:has(button[onclick^="start("]) button{min-width:100px;font-size:14px;padding:10px}#app > .card.row:has(button[onclick^="start("]) b{font-size:22px}}
/* V4 : rappel permanent des performances de la dernière séance */
.previous-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;text-align:center}
.previous-table th,.previous-table td{padding:10px 6px;border-bottom:1px solid #344660}
.previous-table th{color:#a9bdd8;font-weight:600}
.previous-title{font-size:17px;margin:0}
</style></head><body><main id="app"></main><nav class="tabs"><button onclick="go('home')">Accueil</button><button onclick="go('progress')">Progrès</button><button onclick="go('history')">Historique</button><button onclick="go('settings')">Données</button></nav><script>
const defaults={Push:{Pectoraux:['Développé couché incliné Smith','Pec fly','Développé incliné haltères','Dips','Développé couché','Poulie en haut','Poulie en bas'],Épaules:['Élévations latérales poulie','Élévations latérales haltères','Développé militaire machine','Développé militaire haltères'],Triceps:['Extension poulie corde vers le bas','Extension poulie corde vers le haut','Barre au front','Haltère au-dessus de la tête','Extension poulie barre vers le bas']},Pull:{Dos:['Tirage vertical barre horizontale','Tractions','Tirage vertical prise serrée','Tirage vertical prise moyenne','Tirage horizontal V machine Basic','Tirage horizontal largeur machine Basic','Tirage horizontal V machine Fitness','Tirage horizontal largeur machine Fitness','Rowing barre','Rowing bûcheron'],"Arrière d’épaules":['Reverse pec deck','Oiseau à la poulie','Oiseau aux haltères'],Biceps:['Curl incliné','Curl marteau haltères','Curl marteau poulie','Curl barre libre','Curl barre poulie']},Legs:{Quadriceps:['Presse horizontale','Squat','Fentes','Presse verticale','Hack squat'],"Ischio-jambiers":['Leg curl','Leg curl inversé machine assis','Leg curl inversé couché'],Fessiers:['Hip thrust'],Mollets:['Extensions mollets']},Extras:{Abdominaux:['Crunch poulie','Relevés de jambes','Training gainage'],Cardio:['Tapis de course','Vélo','Corde à sauter','Rameur']}};
const KEY='masalle-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}db ||= {library:defaults,history:[],active:null};let page='home',group='',exercise='',selected='';const app=document.getElementById('app');const save=()=>{localStorage.setItem(KEY,JSON.stringify(db))};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=(g,e)=>g+'::'+e;const all=()=>Object.entries(db.library).flatMap(([p,gs])=>Object.entries(gs).flatMap(([g,es])=>es.map(e=>({p,g,e,k:key(g,e)}))));function go(p){page=p;render()}function start(p){db.active={type:p,date:new Date().toISOString(),entries:[],extras:{Abdominaux:false,Cardio:false}};save();go('workout')}function end(){if(!db.active)return; if(!confirm('Terminer et enregistrer la séance ?'))return;db.history.unshift(db.active);db.active=null;save();go('history')}function cancelWorkout(){if(!db.active)return;if(!confirm('Annuler cette séance ? Toutes les séries de cette séance seront supprimées. Cette action est irréversible.'))return;db.active=null;save();go('home')}function cancelExercise(){if(!db.active)return;const n=db.active.entries.filter(x=>x.group===group&&x.name===exercise).length;if(!n)return go('workout');if(!confirm('Annuler '+exercise+' ? Ses séries seront supprimées de la séance en cours.'))return;db.active.entries=db.active.entries.filter(x=>!(x.group===group&&x.name===exercise));save();go('workout')}function count(g,e){return db.active?.entries.filter(x=>x.group===g&&x.name===e).reduce((a,x)=>a+x.sets.length,0)||0}function render(){document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',['home','progress','history','settings'][i]===page));let h='';if(page==='home'){h='<h1>💪 Ma Salle</h1><p class="muted">Ton carnet d’entraînement personnel</p>';if(db.active)h+='<div class="card"><b>Séance en cours : '+esc(db.active.type)+'</b><br><br><button onclick="go(\'workout\')">Reprendre la séance</button></div>';else for(const p of ['Push','Pull','Legs'])h+=`<div class="card row"><div><b>${p}</b><div class="muted">${Object.keys(db.library[p]).join(' · ')}</div></div><button onclick="start('${p}')">Commencer</button></div>`}else if(page==='workout'){if(!db.active){go('home');return}h=`<h1>${esc(db.active.type)} <span class="muted">en cours</span></h1>`;for(const g of Object.keys(db.library[db.active.type]))h+=groupCard(g);for(const g of ['Abdominaux','Cardio']){h+=`<div class="card"><label><input type="checkbox" ${db.active.extras[g]?'checked':''} onchange="toggleExtra('${g}',this.checked)"> J’ai fait : ${g}</label>${db.active.extras[g]?groupCard(g):''}</div>`}h+='<button class="wide" onclick="end()">✅ Fin de séance</button><button class="danger wide" style="margin-top:12px" onclick="cancelWorkout()">✕ Annuler la séance</button>'}else if(page==='group'){const list=db.library[group==='Abdominaux'||group==='Cardio'?'Extras':db.active.type][group];h=`<button class="secondary" onclick="go('workout')">← Séance</button><h1>${esc(group)}</h1>`;for(const e of [...list].sort((a,b)=>count(group,b)-count(group,a)))h+=`<div class="card row"><div>${esc(e)} ${count(group,e)?`<div class="pill">✓ ${count(group,e)} séries</div>`:''}</div><button onclick="openEx('${encodeURIComponent(e)}')">Choisir</button></div>`;h+='<button class="secondary wide" onclick="addEx()">+ Créer un exercice</button>'}else if(page==='exercise'){const cardio=group==='Cardio',timed=exercise==='Training gainage';const entries=db.active.entries.filter(x=>x.group===group&&x.name===exercise);const previousSession=db.history.find(s=>s.entries?.some(x=>x.group===group&&x.name===exercise&&x.sets?.length));const previousSets=previousSession?previousSession.entries.filter(x=>x.group===group&&x.name===exercise).flatMap(x=>x.sets):[];h=`<button class="secondary" onclick="go('group')">← Exercices</button><h1>${esc(exercise)}</h1>`;entries.forEach((entry,i)=>{h+=`<div class="card"><b>Passage ${i+1}</b>`;entry.sets.forEach((s,j)=>{h+=`<div class="set"><span>${j+1}</span><input class="field" type="number" min="0" step="any" value="${s.kg}" placeholder="${cardio?'km':timed?'sec':'kg'}" onchange="updateSet(${i},${j},'kg',this.value)"><input class="field" type="number" min="0" step="1" value="${s.reps}" placeholder="${cardio?'min':timed?'séries':'reps'}" onchange="updateSet(${i},${j},'reps',this.value)"><button class="danger" onclick="delSet(${i},${j})">×</button></div>`});h+=`<button onclick="addSet(${i})">+ Ajouter une série</button></div>`});if(!entries.length)h+='<button class="wide" onclick="addEntry()">+ Ajouter une série</button>';h+=`<div class="card"><h2 class="previous-title">📋 Dernière fois sur cet exercice</h2>${previousSession?`<p class="muted">${new Date(previousSession.date).toLocaleDateString('fr-FR')} · ${previousSets.length} série(s)</p><table class="previous-table"><thead><tr><th>Série</th><th>${cardio?'Distance (km)':timed?'Durée (sec)':'Charge (kg)'}</th><th>${cardio?'Durée (min)':timed?'Répétitions':'Répétitions'}</th></tr></thead><tbody>${previousSets.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.kg)}</td><td>${esc(s.reps)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Première fois sur cet exercice 💪</p>'}</div>`;h+='<button class="secondary wide" onclick="go(\'workout\')">Terminer l’exercice</button><button class="danger wide" style="margin-top:12px" onclick="cancelExercise()">✕ Annuler cet exercice</button><p class="muted">'+(cardio?'Cardio : colonne 1 = distance (km), colonne 2 = durée (min).':timed?'Gainage : colonne 1 = durée (secondes), colonne 2 = nombre de répétitions.':'Colonnes : poids (kg) et répétitions. Les modifications sont sauvegardées automatiquement.')+'</p>'}else if(page==='history'){h='<h1>Historique</h1>';for(const [i,s] of db.history.entries())h+=`<div class="card"><b>${esc(s.type)} · ${new Date(s.date).toLocaleDateString('fr-FR')}</b><p class="muted">${s.entries.length} exercices · ${s.entries.reduce((n,e)=>n+e.sets.length,0)} séries</p><button class="secondary" onclick="details(${i})">Détails</button></div>`;if(!db.history.length)h+='<p>Aucune séance terminée pour le moment.</p>'}else if(page==='details'){let s=db.history[Number(selected)];h=`<button class="secondary" onclick="go('history')">← Historique</button><h1>${esc(s.type)} · ${new Date(s.date).toLocaleDateString('fr-FR')}</h1>`;for(const e of s.entries)h+=`<div class="card"><b>${esc(e.name)}</b><p>${e.sets.map((v,i)=>`Série ${i+1} : ${v.kg} / ${v.reps}`).join('<br>')}</p></div>`}else if(page==='progress'){h='<h1>📈 Progression</h1><select class="field" onchange="selected=this.value;render()"><option value="">Choisir un exercice</option>'+all().map(x=>`<option value="${esc(x.k)}" ${selected===x.k?'selected':''}>${esc(x.e)} (${esc(x.g)})</option>`).join('')+'</select><div class="card"><canvas id="chart" width="600" height="240"></canvas><p class="muted">Charge maximale par séance (kg), ou distance pour le cardio.</p></div>';if(selected){const data=db.history.slice().reverse().map(s=>({date:s.date,vals:s.entries.filter(x=>key(x.group,x.name)===selected).flatMap(x=>x.sets)})).filter(x=>x.vals.length);h+=`<p>${data.length} séance(s) enregistrée(s) pour cet exercice.</p>`;setTimeout(()=>chart(data),0)}}else if(page==='settings'){h='<h1>💾 Tes données</h1><p>Enregistrement automatique sur cet appareil. Exporte régulièrement une sauvegarde, notamment avant de changer de téléphone.</p><button onclick="exportData()">Exporter ma sauvegarde</button><label>Importer une sauvegarde JSON<input type="file" accept="application/json" onchange="importData(this.files[0])"></label><p class="muted">Sans compte ni serveur : les données restent dans ce navigateur. Ne supprime pas ses données sans sauvegarde.</p>'}app.innerHTML=h}function groupCard(g){let done=db.active.entries.filter(x=>x.group===g).length;return `<div class="card row"><div><b>${esc(g)}</b><div class="muted">${done} exercice(s) ajouté(s)</div></div><button onclick="openGroup('${encodeURIComponent(g)}')">Choisir →</button></div>`}function openGroup(g){group=decodeURIComponent(g);go('group')}function openEx(e){exercise=decodeURIComponent(e);if(!db.active.entries.some(x=>x.group===group&&x.name===exercise))addEntry(false);go('exercise')}function addEntry(r=true){db.active.entries.push({group,name:exercise,sets:[]});save();if(r)render()}function addSet(i){let e=db.active.entries.filter(x=>x.group===group&&x.name===exercise)[i];e.sets.push({kg:0,reps:0});save();render()}function updateSet(i,j,k,v){db.active.entries.filter(x=>x.group===group&&x.name===exercise)[i].sets[j][k]=Number(v)||0;save()}function delSet(i,j){db.active.entries.filter(x=>x.group===group&&x.name===exercise)[i].sets.splice(j,1);save();render()}function toggleExtra(g,v){db.active.extras[g]=v;save();render()}function addEx(){let n=prompt('Nom du nouvel exercice :');if(!n?.trim())return;n=n.trim();let p=['Cardio','Abdominaux'].includes(group)?'Extras':db.active.type;if(db.library[p][group].some(x=>x.toLowerCase()===n.toLowerCase()))return alert('Cet exercice existe déjà.');db.library[p][group].push(n);save();render()}function details(i){selected=i;go('details')}function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ma-salle-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importData(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!d.library||!Array.isArray(d.history))throw Error();if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){db=d;save();go('home')}}catch{alert('Fichier de sauvegarde invalide.')}}function chart(data){let c=document.getElementById('chart');if(!c)return;let ctx=c.getContext('2d');ctx.clearRect(0,0,600,240);let vals=data.map(x=>Math.max(...x.vals.map(s=>s.kg)));ctx.strokeStyle='#38516e';for(let i=0;i<5;i++){let y=20+i*45;ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(585,y);ctx.stroke()}if(!vals.length){ctx.fillStyle='#aabbd1';ctx.font='19px system-ui';ctx.fillText('Pas encore de données',170,125);return}let max=Math.max(...vals,1);ctx.strokeStyle='#238bff';ctx.lineWidth=4;ctx.beginPath();vals.forEach((v,i)=>{let x=55+(vals.length===1?250:i*510/(vals.length-1)),y=205-v/max*170;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#58a8ff';vals.forEach((v,i)=>{let x=55+(vals.length===1?250:i*510/(vals.length-1)),y=205-v/max*170;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill()})}render();</script></body></html>
