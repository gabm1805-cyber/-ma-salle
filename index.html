<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Salle">
<title>Ma Salle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une colonne de 560px max, listes groupées façon iOS, barre d'onglets fixe + dock contextuel (chrono / séance en cours).
   Couleurs des programmes inspirées du code couleur des disques olympiques : 25 kg rouge, 20 kg bleu, 15 kg jaune, 10 kg vert. */
:root{
  --bg:#0C0F14;
  --surface:#141922;
  --raised:#1B212C;
  --line:#242B37;
  --line-2:#323A48;
  --text:#E8ECF2;
  --text-2:#9DA6B5;
  --text-3:#687284;
  --primary:#E8ECF2;
  --on-primary:#0C0F14;
  --push:#FF7A5C;
  --pull:#6B9BFF;
  --legs:#F2C14E;
  --extra:#4FCB8F;
  --ok:#4FCB8F;
  --danger:#FF6670;
  --focus:#8FB3FF;
  --c:var(--pull);

  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  --r-s:10px;
  --r-m:14px;
  --r-l:20px;
  --tab-h:62px;
  --dock-h:0px;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.has-dock{--dock-h:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}

main{
  max-width:560px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);
  padding-bottom:calc(var(--tab-h) + var(--dock-h) + env(safe-area-inset-bottom,0px) + 32px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}

.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i-fill{fill:currentColor;stroke:none}

/* En-têtes */
.nav-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:0 -16px;padding:4px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 12px 0 4px;border-radius:var(--r-s);color:var(--text-2);font-weight:500}
.back:active{color:var(--text)}
.page-head{display:grid;gap:6px;padding:16px 0 4px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2)}
.title-xl{font:700 46px/.95 var(--font-display);letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
.title-xl.tinted{color:var(--c)}
.title-l{font:700 32px/1.05 var(--font-display);text-wrap:balance}
.head-meta{font-size:15px;color:var(--text-2)}

/* Sections */
.section{margin-top:28px}
.section-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-title{margin-bottom:10px;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.section-row .section-title{margin:0}
.section-meta,.section-link{font-size:14px;color:var(--text-2)}
.section-link{display:inline-flex;align-items:center;min-height:32px;font-weight:600;color:var(--text)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:var(--r-m);font-size:16px;font-weight:600;transition:transform .12s ease,background-color .15s ease}
.btn:active{transform:scale(.98)}
.btn-block{width:100%}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-secondary{background:var(--raised);border:1px solid var(--line-2);color:var(--text)}
.btn-danger{background:var(--danger);color:var(--on-primary)}
.btn-ghost-danger{min-height:48px;color:var(--danger)}
.actions{display:grid;gap:8px;margin-top:28px}

/* Listes groupées */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row,.row-btn{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 16px}
.row-btn{transition:background-color .12s}
.row-btn:active{background:var(--raised)}
.row-main{flex:1;min-width:0;display:grid;gap:2px}
.row-title{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:14px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub.ok{color:var(--ok)}
.row-side{font-size:14px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.row-value{font:600 20px/1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{width:18px;height:18px;color:var(--text-3)}
.row.nested{padding-left:32px;background:color-mix(in srgb,var(--raised) 50%,var(--surface))}
.add-row{color:var(--text-2)}
.add-row .i{color:var(--text)}
.count{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 9px;border-radius:99px;background:var(--raised);color:var(--text-3);font:700 17px/1 var(--font-display);font-variant-numeric:tabular-nums}
.count.on{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}

/* Disque de programme */
.plate{--hole:var(--surface);width:16px;height:16px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--hole) 0 3px,var(--c) 3.5px)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}

/* Accueil */
.resume{display:grid;gap:4px;width:100%;margin-top:16px;padding:20px;border-radius:var(--r-l);text-align:left;background:linear-gradient(155deg,color-mix(in srgb,var(--c) 20%,var(--surface)) 0%,var(--surface) 65%);border:1px solid color-mix(in srgb,var(--c) 38%,var(--line))}
.resume-top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2)}
.resume-title{font:700 44px/1 var(--font-display);text-transform:uppercase;color:var(--c)}
.resume-meta{font-size:15px;color:var(--text-2)}
.resume-cta{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;margin-top:14px;border-radius:var(--r-m);background:var(--primary);color:var(--on-primary);font-weight:600}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
.day{display:grid;justify-items:center;gap:7px;padding:10px 0 9px;border-radius:12px}
.day.today{background:var(--raised)}
.day-l{font-size:12px;font-weight:600;color:var(--text-3)}
.day.today .day-l{color:var(--text)}
.day-n{font:600 19px/1 var(--font-display);font-variant-numeric:tabular-nums}
.day.future .day-n{color:var(--text-3)}
.dots{display:flex;align-items:center;gap:3px;height:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dots i.none{width:4px;height:4px;background:var(--line-2)}

.programs{display:grid;gap:10px}
.program{position:relative;display:grid;gap:8px;width:100%;padding:18px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);text-align:left;overflow:hidden;transition:transform .12s ease}
.program:active{transform:scale(.985)}
.program::before{content:"";position:absolute;inset:0;background:radial-gradient(220px 120px at 100% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%);pointer-events:none}
.program.suggested{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.program-head{display:flex;align-items:center;gap:10px}
.program-name{font:700 32px/1 var(--font-display);text-transform:uppercase}
.chip{margin-left:auto;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.program-groups{font-size:15px;color:var(--text-2)}
.program-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;font-size:14px;color:var(--text-3)}
.program-go{display:inline-flex;align-items:center;gap:2px;color:var(--text);font-weight:600}

/* Statistiques */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:16px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{display:grid;gap:4px;padding:14px 16px;background:var(--surface);min-width:0}
.stat b{font:700 30px/1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b small{font-size:17px;font-weight:600;color:var(--text-2);margin-left:2px}
.stat span{font-size:13px;color:var(--text-2)}
.stat .up{color:var(--ok)}
.stat .down{color:var(--danger)}

/* Interrupteur */
.switch{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:51px;height:31px;margin:0;border-radius:99px;background:var(--line-2);cursor:pointer;transition:background-color .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .2s ease}
.switch:checked{background:var(--ok)}
.switch:checked::after{transform:translateX(20px)}
label.row{cursor:pointer}

/* Exercice */
.prev-note{margin-top:14px;padding:12px 16px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--text-2)}
.prev-note b{color:var(--text);font-weight:600}
.sets{margin-top:16px;padding:6px 12px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
.sets+.sets{margin-top:12px}
.sets-title{padding:10px 4px 2px;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.sets-head,.set-row{display:grid;grid-template-columns:26px minmax(58px,.85fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:center}
.sets-head{padding:8px 0 4px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.sets-head span:nth-child(3),.sets-head span:nth-child(4){text-align:center}
.set-row{padding:5px 0}
.set-n{font:700 20px/1 var(--font-display);color:var(--text-2);text-align:center;font-variant-numeric:tabular-nums}
.prev{min-height:44px;padding:0 4px;border-radius:var(--r-s);font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums;text-align:left;white-space:nowrap}
.prev:not(:disabled):active{background:var(--raised);color:var(--text)}
.prev:disabled{color:var(--text-3)}
.num{width:100%;min-width:0;height:50px;padding:0 4px;border-radius:var(--r-s);background:var(--bg);border:1px solid var(--line-2);color:var(--text);text-align:center;font:600 24px/1 var(--font-display);font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s}
.num::placeholder{color:var(--text-3)}
.num:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.del{display:grid;place-items:center;width:40px;height:44px;border-radius:var(--r-s);color:var(--text-3)}
.del:active{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.add-set{margin-top:8px;min-height:48px}
.hint{margin:16px 4px 0;font-size:14px;color:var(--text-3)}

/* Historique / détails */
.ex-block{padding:14px 16px}
.ex-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ex-head h3{font-size:16px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.ex-head span{font-size:13px;color:var(--text-3);white-space:nowrap}
.set-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.set-chips li{display:flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:8px;background:var(--raised);font-size:14px;font-variant-numeric:tabular-nums}
.set-chips li span{font:700 13px/1 var(--font-display);color:var(--text-3)}

/* Progression */
.select-wrap{position:relative;margin-top:16px}
.select{appearance:none;-webkit-appearance:none;width:100%;min-height:52px;padding:0 44px 0 16px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line-2);font-size:16px;font-weight:600}
.select-wrap .i{position:absolute;top:50%;right:14px;transform:translateY(-50%) rotate(90deg);color:var(--text-2);pointer-events:none}
.chart-card{margin-top:12px;padding:14px 10px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
.chart-card canvas{display:block;width:100%;height:220px}
.caption{margin:8px 6px 0;font-size:13px;color:var(--text-3)}

.empty{display:grid;gap:4px;padding:32px 20px;text-align:center;font-size:15px;color:var(--text-2);background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-l)}
.empty b{font-size:17px;color:var(--text)}
.note{margin-top:12px;font-size:14px;color:var(--text-3)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Dock : chrono de repos ou séance en cours */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:15;padding:0 max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.dock-inner{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;margin:0 auto;padding:10px 10px 10px 18px;background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r-l);box-shadow:0 12px 32px rgba(0,0,0,.5);text-align:left}
.rest-read{flex:1;min-width:0;display:grid;gap:2px}
.rest-label{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.rest-clock{font:700 34px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--text-2)}
.rest-clock.running{color:var(--text)}
.rest-toggle{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 18px;border-radius:var(--r-m);background:var(--primary);color:var(--on-primary);font-weight:600}
.icon-btn{display:grid;place-items:center;width:50px;height:50px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line-2);color:var(--text-2)}
.icon-btn:active{color:var(--text)}
.resume-bar .row-main{gap:0}
.resume-bar-cta{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 6px 0 12px;font-weight:600}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:16;display:flex;justify-content:center;padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{flex:1;max-width:132px;height:var(--tab-h);display:grid;place-items:center;align-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--text-3)}
.tab-ic{display:grid;place-items:center;width:52px;height:30px;border-radius:99px;transition:background-color .15s}
.tab .i{width:22px;height:22px}
.tab.active{color:var(--text)}
.tab.active .tab-ic{background:var(--raised)}

/* Feuille de dialogue */
dialog.sheet{width:100%;max-width:560px;margin:auto auto 0;padding:0;border:0;border-top:1px solid var(--line-2);border-radius:24px 24px 0 0;background:var(--raised);color:var(--text)}
dialog.sheet[open]{animation:sheet-in .22s ease-out}
dialog.sheet::backdrop{background:rgba(4,6,9,.62)}
@keyframes sheet-in{from{transform:translateY(24px);opacity:0}}
.sheet-body{display:grid;gap:10px;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet-title{font-size:20px;font-weight:700;text-wrap:balance}
.sheet-text{font-size:15px;color:var(--text-2)}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.field{width:100%;min-height:52px;margin-top:4px;padding:0 14px;border-radius:var(--r-m);background:var(--bg);border:1px solid var(--line-2);color:var(--text);font-size:16px}
.field:focus{outline:none;border-color:var(--focus)}
@media (min-width:600px){dialog.sheet{margin:auto;border:1px solid var(--line-2);border-radius:24px}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--dock-h) + env(safe-area-inset-bottom,0px) + 12px);z-index:30;transform:translateX(-50%);display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);padding:10px 10px 10px 16px;border-radius:var(--r-m);background:var(--text);color:var(--on-primary);font-size:15px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.toast button{min-height:36px;padding:0 10px;border-radius:8px;font-weight:700;text-decoration:underline;text-underline-offset:3px}

@media (max-width:370px){
  .title-xl{font-size:40px}
  .sets-head,.set-row{grid-template-columns:22px minmax(50px,.8fr) minmax(0,1fr) minmax(0,1fr) 36px;gap:6px}
  .rest-toggle span{display:none}
  .rest-toggle{padding:0 15px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main id="app"></main>
<div id="dock" class="dock" hidden></div>
<nav id="tabs" class="tabs" aria-label="Navigation principale"></nav>
<dialog id="sheet" class="sheet"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const defaults={Push:{Pectoraux:['Développé couché incliné Smith','Pec fly','Développé incliné haltères','Dips','Développé couché','Poulie en haut','Poulie en bas'],Épaules:['Élévations latérales poulie','Élévations latérales haltères','Développé militaire machine','Développé militaire haltères'],Triceps:['Extension poulie corde vers le bas','Extension poulie corde vers le haut','Barre au front','Haltère au-dessus de la tête','Extension poulie barre vers le bas']},Pull:{Dos:['Tirage vertical barre horizontale','Tractions','Tirage vertical prise serrée','Tirage vertical prise moyenne','Tirage horizontal V machine Basic','Tirage horizontal largeur machine Basic','Tirage horizontal V machine Fitness','Tirage horizontal largeur machine Fitness','Rowing barre','Rowing bûcheron'],"Arrière d’épaules":['Reverse pec deck','Oiseau à la poulie','Oiseau aux haltères'],Biceps:['Curl incliné','Curl marteau haltères','Curl marteau poulie','Curl barre libre','Curl barre poulie']},Legs:{Quadriceps:['Presse horizontale','Squat','Fentes','Presse verticale','Hack squat'],"Ischio-jambiers":['Leg curl','Leg curl inversé machine assis','Leg curl inversé couché'],Fessiers:['Hip thrust'],Mollets:['Extensions mollets'],Lombaires:['Extensions lombaires au banc']},Extras:{Abdominaux:['Crunch poulie','Relevés de jambes','Training gainage'],Cardio:['Tapis de course','Vélo','Corde à sauter','Rameur']}};
const PROGRAMS=['Push','Pull','Legs'];
const PROG_VAR={Push:'--push',Pull:'--pull',Legs:'--legs',Extras:'--extra'};
const progColor=p=>'var('+(PROG_VAR[p]||'--extra')+')';

const ICONS={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v11.5h13V9"/><path d="M10 20.5v-6h4v6"/>',
  chart:'<path d="M3.5 3.5v17h17"/><path d="m7.5 14.5 4-4.5 3 3 5.5-6"/>',

  back:'<path d="m15 18-6-6 6-6"/>',

  plus:'<path d="M12 5v14M5 12h14"/>',

  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',

  pause:'<path d="M8.5 5.5v13M15.5 5.5v13" stroke-width="3"/>',

};
const icon=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

// Le chrono est volontairement temporaire : aucune durée n'est sauvegardée.
let restElapsed=0,restStartedAt=null,restExercise='';
function restTime(){return restElapsed+(restStartedAt===null?0:Math.max(0,Date.now()-restStartedAt))}
function formatRest(ms){const seconds=Math.floor(ms/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function tickRest(){const el=document.getElementById('rest-clock');if(el){el.textContent=formatRest(restTime());el.classList.toggle('running',restStartedAt!==null)}}
function restStart(){if(restStartedAt===null){restStartedAt=Date.now();tickRest()}}
function restPause(){if(restStartedAt!==null){restElapsed=restTime();restStartedAt=null;tickRest()}}
function restReset(){restElapsed=0;restStartedAt=null;tickRest();if(page==='exercise')renderDock()}
function restToggle(){restStartedAt===null?restStart():restPause();renderDock()}
function restForExercise(){const id=group+'::'+exercise;if(restExercise!==id){restExercise=id;restElapsed=0;restStartedAt=null}}
setInterval(()=>{tickRest();document.querySelectorAll('[data-since]').forEach(el=>el.textContent=elapsed(el.dataset.since))},500);

const KEY='masalle-v1';
function normalize(d){d.library ||= structuredClone(defaults);d.history ||= [];if(d.library.Legs&&!d.library.Legs.Lombaires)d.library.Legs.Lombaires=['Extensions lombaires au banc'];if(d.active){d.active.extras ||= {};d.active.extras.Lombaires ??= false}return d}
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}
db=normalize(db||{library:structuredClone(defaults),history:[],active:null});
let page='home',group='',exercise='',detailIndex=0,progressKey='';
const app=document.getElementById('app'),dock=document.getElementById('dock');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('Impossible d’enregistrer sur cet appareil. Exporte une sauvegarde.')}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arg=v=>esc(JSON.stringify(v));
const key=(g,e)=>g+'::'+e;
const all=()=>Object.entries(db.library).flatMap(([p,gs])=>Object.entries(gs).flatMap(([g,es])=>es.map(e=>({p,g,e,k:key(g,e)}))));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const num=v=>(Number(v)||0).toLocaleString('fr-FR',{maximumFractionDigits:2});
const plural=(n,w)=>n+' '+w+(n>1?'s':'');
const fmtDate=d=>new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const fmtDay=d=>cap(new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}));
const fmtTime=d=>new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const dayStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
function ago(d){const n=Math.round((dayStart(new Date())-dayStart(d))/864e5);if(n<=0)return 'aujourd’hui';if(n===1)return 'hier';if(n<7)return 'il y a '+n+' j';if(n<35)return 'il y a '+Math.floor(n/7)+' sem.';return 'le '+fmtDate(d)}
function elapsed(iso,until){const m=Math.max(0,Math.floor(((until?new Date(until):Date.now())-new Date(iso))/60000));return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')}

const match=(g,e)=>x=>x.group===g&&x.name===e;
const setsOf=(s,g,e)=>(s.entries||[]).filter(match(g,e)).flatMap(x=>x.sets||[]);
const lastSession=(g,e)=>db.history.find(s=>setsOf(s,g,e).length);
const setCount=s=>(s.entries||[]).reduce((n,e)=>n+(e.sets||[]).length,0);
const exCount=s=>new Set((s.entries||[]).filter(e=>e.sets?.length).map(e=>key(e.group,e.name))).size;
const isLoad=(g,e)=>g!=='Cardio'&&e!=='Training gainage';
const volume=s=>(s.entries||[]).filter(e=>isLoad(e.group,e.name)).reduce((t,e)=>t+(e.sets||[]).reduce((a,x)=>a+(Number(x.kg)||0)*(Number(x.reps)||0),0),0);
const best=sets=>sets.reduce((b,x)=>!b||x.kg>b.kg||(x.kg===b.kg&&x.reps>b.reps)?x:b,null);
function units(g,e){
  if(g==='Cardio')return {kind:'cardio',a:'km',b:'min',la:'Distance',lb:'Durée',metric:'Distance maximale par séance (km)'};
  if(e==='Training gainage')return {kind:'time',a:'s',b:'rép.',la:'Durée',lb:'Répétitions',metric:'Durée maximale par séance (secondes)'};
  return {kind:'load',a:'kg',b:'rép.',la:'Charge',lb:'Répétitions',metric:'Charge maximale par séance (kg)'};
}
function setTxt(s,u){return u.kind==='cardio'?`${num(s.kg)} km · ${num(s.reps)} min`:u.kind==='time'?`${num(s.kg)} s × ${num(s.reps)}`:`${num(s.kg)} kg × ${num(s.reps)}`}
const progOfGroup=g=>g==='Abdominaux'||g==='Cardio'?'Extras':db.active.type;
const entriesOf=()=>db.active.entries.filter(match(group,exercise));

// Mise en veille de l'écran bloquée pendant une séance, quand le navigateur le permet.
let wakeLock=null;
async function keepAwake(){if(!db.active||wakeLock||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}catch{}}
function releaseAwake(){try{wakeLock?.release()}catch{}wakeLock=null}
document.addEventListener('visibilitychange',keepAwake);

/* ---------- Navigation ---------- */
const TABS=[['home','Accueil','home'],['progress','Progrès','chart'],['history','Historique','history'],['settings','Données','data']];
document.getElementById('tabs').innerHTML=TABS.map(([p,l,i])=>`<button class="tab" data-tab="${p}" onclick="go('${p}')"><span class="tab-ic">${icon(i)}</span>${l}</button>`).join('');
const TAB_OF={home:'home',workout:'home',group:'home',exercise:'home',progress:'progress',history:'history',details:'history',settings:'settings'};
function go(p){page=p;render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.tab===TAB_OF[page];b.classList.toggle('active',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  const views={home:viewHome,workout:viewWorkout,group:viewGroup,exercise:viewExercise,history:viewHistory,details:viewDetails,progress:viewProgress,settings:viewSettings};
  const inSession=['workout','group','exercise'].includes(page)&&db.active;
  document.documentElement.style.setProperty('--c',inSession?progColor(db.active.type):'var(--pull)');
  const h=views[page]();
  if(h==null)return;
  app.innerHTML=h;
  renderDock();
  if(page==='progress')requestAnimationFrame(drawProgress);
  if(db.active)keepAwake();
}
function renderDock(){
  let h='';
  if(page==='exercise'&&db.active){
    const running=restStartedAt!==null;
    h=`<div class="dock-inner"><div class="rest-read"><span class="rest-label">Repos</span><span id="rest-clock" class="rest-clock${running?' running':''}" role="timer">${formatRest(restTime())}</span></div><button class="icon-btn" onclick="restReset()" aria-label="Remettre le chrono à zéro">${icon('reset')}</button><button class="rest-toggle" onclick="restToggle()">${icon(running?'pause':'play')}<span>${running?'Pause':restElapsed?'Reprendre':'Démarrer'}</span></button></div>`;
  }else if(db.active&&!['home','workout','group'].includes(page)){
    h=`<button class="dock-inner resume-bar" onclick="go('workout')"><span class="live-dot"></span><span class="row-main"><span class="row-title">${esc(db.active.type)} en cours</span><span class="row-sub" data-since="${db.active.date}">${elapsed(db.active.date)}</span></span><span class="resume-bar-cta">Reprendre${icon('next')}</span></button>`;
  }
  dock.innerHTML=h;dock.hidden=!h;document.body.classList.toggle('has-dock',!!h);
}
const navHead=(label,target)=>`<div class="nav-head"><button class="back" onclick="go('${target}')">${icon('back')}${esc(label)}</button></div>`;

/* ---------- Accueil ---------- */
function viewHome(){
  let h=`<header class="page-head"><p class="eyebrow">${fmtDay(new Date())}</p><h1 class="title-xl">Ma Salle</h1></header>`;
  if(db.active){
    const a=db.active,n=setCount(a);
    h+=`<button class="resume" style="--c:${progColor(a.type)}" onclick="go('workout')"><span class="resume-top"><span class="live-dot"></span>Séance en cours</span><span class="resume-title">${esc(a.type)}</span><span class="resume-meta">Depuis <span data-since="${a.date}">${elapsed(a.date)}</span> · ${plural(n,'série')}</span><span class="resume-cta">Reprendre la séance${icon('next')}</span></button>`;
  }
  h+=weekStrip();
  if(!db.active){
    const last=Object.fromEntries(PROGRAMS.map(p=>[p,db.history.find(s=>s.type===p)]));
    const suggested=PROGRAMS.slice().sort((a,b)=>(last[a]?new Date(last[a].date):0)-(last[b]?new Date(last[b].date):0))[0];
    h+=`<section class="section"><h2 class="section-title">Démarrer une séance</h2><div class="programs">`;
    for(const p of PROGRAMS){
      const s=last[p],sug=db.history.length&&p===suggested;
      h+=`<button class="program${sug?' suggested':''}" style="--c:${progColor(p)}" onclick="start('${p}')"><span class="program-head"><span class="plate"></span><span class="program-name">${p}</span>${sug?'<span class="chip">À faire</span>':''}</span><span class="program-groups">${Object.keys(db.library[p]).map(esc).join(' · ')}</span><span class="program-foot"><span>${s?'Dernière '+ago(s.date):'Jamais faite'}</span><span class="program-go">Commencer${icon('next')}</span></span></button>`;
    }
    h+='</div></section>';
  }
  if(db.history.length){
    h+=`<section class="section"><div class="section-row"><h2 class="section-title">Dernières séances</h2><button class="section-link" onclick="go('history')">Tout voir</button></div><div class="list">${db.history.slice(0,3).map((s,i)=>sessionRow(s,i)).join('')}</div></section>`;
  }
  return h;
}
function weekStrip(){
  const today=dayStart(new Date()),monday=new Date(today);monday.setDate(today.getDate()-(today.getDay()+6)%7);
  const sessions=[...(db.active?[db.active]:[]),...db.history];
  let count=0,sets=0,cells='';
  'LMMJVSD'.split('').forEach((l,i)=>{
    const d=new Date(monday);d.setDate(monday.getDate()+i);
    const daySessions=sessions.filter(s=>dayStart(s.date).getTime()===d.getTime());
    count+=daySessions.length;sets+=daySessions.reduce((n,s)=>n+setCount(s),0);
    const dots=daySessions.length?daySessions.slice(0,3).map(s=>`<i style="--c:${progColor(s.type)}"></i>`).join(''):'<i class="none"></i>';
    cells+=`<div class="day${d.getTime()===today.getTime()?' today':''}${d>today?' future':''}"><span class="day-l">${l}</span><span class="day-n">${d.getDate()}</span><span class="dots">${dots}</span></div>`;
  });
  return `<section class="section"><div class="section-row"><h2 class="section-title">Cette semaine</h2><span class="section-meta">${plural(count,'séance')} · ${plural(sets,'série')}</span></div><div class="week">${cells}</div></section>`;
}
function sessionRow(s,i){
  const v=volume(s);
  return `<button class="row-btn" onclick="details(${i})"><span class="plate" style="--c:${progColor(s.type)}"></span><span class="row-main"><span class="row-title">${esc(s.type)}</span><span class="row-sub">${plural(exCount(s),'exo')} · ${plural(setCount(s),'série')}${v?' · '+num(Math.round(v))+' kg':''}</span></span><span class="row-side">${fmtDate(s.date)}</span>${icon('next','chev')}</button>`;
}

/* ---------- Séance ---------- */
function start(p){restReset();restExercise='';db.active={type:p,date:new Date().toISOString(),entries:[],extras:{Abdominaux:false,Cardio:false,Lombaires:false}};save();go('workout')}
async function end(){
  if(!db.active)return;
  const n=setCount(db.active);
  if(!await sheet({title:'Terminer la séance ?',text:n?plural(n,'série')+' seront enregistrées dans l’historique.':'Aucune série saisie. La séance sera enregistrée vide.',ok:'Terminer'}))return;
  db.active.end=new Date().toISOString();
  db.history.unshift(db.active);db.active=null;restReset();restExercise='';save();releaseAwake();
  detailIndex=0;go('details');toast('Séance enregistrée');
}
async function cancelWorkout(){
  if(!db.active)return;
  if(!await sheet({title:'Annuler cette séance ?',text:'Toutes les séries de cette séance seront supprimées. Cette action est irréversible.',ok:'Annuler la séance',cancel:'Continuer',danger:true}))return;
  db.active=null;restReset();restExercise='';save();releaseAwake();go('home');
}
function viewWorkout(){
  if(!db.active){go('home');return null}
  const a=db.active,v=volume(a);
  const groups=Object.keys(db.library[a.type]).filter(g=>g!=='Lombaires');
  const extras=(a.type==='Legs'?['Lombaires']:[]).concat(['Abdominaux','Cardio']);
  let h=`<header class="page-head"><p class="eyebrow"><span class="live-dot"></span>Séance en cours</p><h1 class="title-xl tinted">${esc(a.type)}</h1><p class="head-meta">Débutée à ${fmtTime(a.date)} · <span data-since="${a.date}">${elapsed(a.date)}</span></p></header>`;
  h+=`<div class="stats"><div class="stat"><b>${exCount(a)}</b><span>Exercices</span></div><div class="stat"><b>${setCount(a)}</b><span>Séries</span></div><div class="stat"><b>${num(v)}</b><span>kg soulevés</span></div></div>`;
  h+=`<section class="section"><h2 class="section-title">Groupes musculaires</h2><div class="list">${groups.map(g=>groupRow(g)).join('')}</div></section>`;
  h+=`<section class="section"><h2 class="section-title">Compléments</h2><div class="list">${extras.map(g=>`<label class="row" for="extra-${g}"><span class="row-main"><span class="row-title">${g}</span></span><input id="extra-${g}" class="switch" type="checkbox" role="switch" ${a.extras[g]?'checked':''} onchange="toggleExtra(${arg(g)},this.checked)"></label>${a.extras[g]?groupRow(g,true):''}`).join('')}</div></section>`;
  h+=`<div class="actions"><button class="btn btn-primary btn-block" onclick="end()">${icon('check')}Terminer la séance</button><button class="btn btn-ghost-danger btn-block" onclick="cancelWorkout()">Annuler la séance</button></div>`;
  return h;
}
function groupRow(g,nested){
  const entries=db.active.entries.filter(x=>x.group===g&&x.sets.length);
  const names=[...new Set(entries.map(x=>x.name))];
  const n=entries.reduce((t,x)=>t+x.sets.length,0);
  return `<button class="row-btn${nested?' row nested':''}" onclick="openGroup(${arg(g)})"><span class="row-main"><span class="row-title">${nested?'Choisir un exercice':esc(g)}</span><span class="row-sub">${names.length?names.map(esc).join(' · '):'Aucun exercice'}</span></span>${n?`<span class="count on" aria-label="${plural(n,'série')}">${n}</span>`:''}${icon('next','chev')}</button>`;
}
function toggleExtra(g,v){db.active.extras[g]=v;save();render()}
function openGroup(g){group=g;go('group')}

/* ---------- Groupe ---------- */
function count(g,e){return db.active?.entries.filter(match(g,e)).reduce((a,x)=>a+x.sets.length,0)||0}
function viewGroup(){
  if(!db.active){go('home');return null}
  const list=db.library[progOfGroup(group)][group];
  let h=navHead('Séance','workout')+`<header class="page-head"><p class="eyebrow">${esc(db.active.type)}</p><h1 class="title-l">${esc(group)}</h1></header><section class="section"><div class="list">`;
  for(const e of [...list].sort((a,b)=>count(group,b)-count(group,a))){
    const n=count(group,e),u=units(group,e);
    let sub;
    if(n)sub=`<span class="row-sub ok">${plural(n,'série')} aujourd’hui</span>`;
    else{const s=lastSession(group,e);sub=`<span class="row-sub">${s?cap(ago(s.date))+' · '+setTxt(best(setsOf(s,group,e)),u):'Jamais fait'}</span>`}
    h+=`<button class="row-btn" onclick="openEx(${arg(e)})"><span class="row-main"><span class="row-title">${esc(e)}</span>${sub}</span>${n?`<span class="count on">${n}</span>`:''}${icon('next','chev')}</button>`;
  }
  h+=`<button class="row-btn add-row" onclick="addEx()">${icon('plus')}<span class="row-main"><span class="row-title">Créer un exercice</span></span></button></div></section>`;
  return h;
}
async function addEx(){
  let n=await sheet({title:'Nouvel exercice',text:'Il sera ajouté à '+group+' pour toutes tes prochaines séances.',input:'Ex. : Développé couché prise serrée',ok:'Créer'});
  if(!n?.trim())return;n=n.trim();
  const p=progOfGroup(group);
  if(db.library[p][group].some(x=>x.toLowerCase()===n.toLowerCase()))return toast('Cet exercice existe déjà.');
  db.library[p][group].push(n);save();render();toast(n+' ajouté');
}

/* ---------- Exercice ---------- */
function openEx(e){exercise=e;if(!db.active.entries.some(match(group,exercise)))addEntry(false);go('exercise')}
function addEntry(r=true){db.active.entries.push({group,name:exercise,sets:[]});save();if(r)render()}
const prevSets=()=>{const s=lastSession(group,exercise);return s?setsOf(s,group,exercise):[]};
function addSet(i){
  const e=entriesOf()[i],last=e.sets[e.sets.length-1],p=prevSets()[e.sets.length];
  const src=last||p;
  e.sets.push(src?{kg:Number(src.kg)||0,reps:Number(src.reps)||0}:{kg:0,reps:0});
  save();render();
  const el=document.getElementById(`set-${i}-${e.sets.length-1}-kg`);
  el?.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function updateSet(i,j,k,v){entriesOf()[i].sets[j][k]=Number(String(v).replace(',','.'))||0;save()}
function copyPrev(i,j){const p=prevSets()[j];if(!p)return;const s=entriesOf()[i].sets[j];s.kg=Number(p.kg)||0;s.reps=Number(p.reps)||0;save();render()}
function delSet(i,j){
  const e=entriesOf()[i],[removed]=e.sets.splice(j,1);save();render();
  toast('Série '+(j+1)+' supprimée','Annuler',()=>{e.sets.splice(j,0,removed);save();render()});
}
async function cancelExercise(){
  if(!db.active)return;
  if(!count(group,exercise)){db.active.entries=db.active.entries.filter(x=>!match(group,exercise)(x));save();return go('group')}
  if(!await sheet({title:'Retirer '+exercise+' ?',text:'Ses séries seront supprimées de la séance en cours.',ok:'Retirer',danger:true}))return;
  db.active.entries=db.active.entries.filter(x=>!match(group,exercise)(x));save();go('group');
}
const inVal=v=>Number(v)?String(v).replace('.',','):'';
function viewExercise(){
  if(!db.active){go('home');return null}
  const u=units(group,exercise),entries=entriesOf(),prevS=lastSession(group,exercise),prev=prevS?setsOf(prevS,group,exercise):[];
  restForExercise();
  let h=navHead(group,'group')+`<header class="page-head"><p class="eyebrow">${esc(group)}</p><h1 class="title-l">${esc(exercise)}</h1></header>`;
  h+=`<p class="prev-note">${prevS?`Dernière fois <b>${ago(prevS.date)}</b> · ${plural(prev.length,'série')} · meilleure <b>${setTxt(best(prev),u)}</b>`:'Première fois sur cet exercice.'}</p>`;
  entries.forEach((entry,i)=>{
    h+=`<section class="sets">${entries.length>1?`<h2 class="sets-title">Passage ${i+1}</h2>`:''}<div class="sets-head" aria-hidden="true"><span>#</span><span>Préc.</span><span>${u.a}</span><span>${u.b}</span><span></span></div>`;
    entry.sets.forEach((s,j)=>{
      const p=prev[j];
      h+=`<div class="set-row"><span class="set-n">${j+1}</span><button class="prev" ${p?`onclick="copyPrev(${i},${j})" aria-label="Reprendre ${setTxt(p,u)}"`:'disabled'}>${p?`${num(p.kg)} × ${num(p.reps)}`:'—'}</button><input id="set-${i}-${j}-kg" class="num" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" value="${inVal(s.kg)}" placeholder="0" aria-label="${u.la} série ${j+1}" onfocus="this.select()" onchange="updateSet(${i},${j},'kg',this.value)"><input id="set-${i}-${j}-reps" class="num" type="text" inputmode="${u.kind==='cardio'?'decimal':'numeric'}" autocomplete="off" enterkeyhint="done" value="${inVal(s.reps)}" placeholder="0" aria-label="${u.lb} série ${j+1}" onfocus="this.select()" onchange="updateSet(${i},${j},'reps',this.value)"><button class="del" onclick="delSet(${i},${j})" aria-label="Supprimer la série ${j+1}">${icon('x')}</button></div>`;
    });
    h+=`<button class="btn btn-secondary btn-block add-set" onclick="addSet(${i})">${icon('plus')}Ajouter une série</button></section>`;
  });
  if(!entries.length)h+=`<button class="btn btn-secondary btn-block add-set" onclick="addEntry()">${icon('plus')}Ajouter une série</button>`;
  h+=`<p class="hint">${u.kind==='cardio'?'Colonne 1 : distance en km. Colonne 2 : durée en minutes.':u.kind==='time'?'Colonne 1 : durée en secondes. Colonne 2 : nombre de répétitions.':'Une nouvelle série reprend les valeurs de la précédente. Touche « Préc. » pour copier la séance d’avant.'} Tout est enregistré automatiquement.</p>`;
  h+=`<div class="actions"><button class="btn btn-primary btn-block" onclick="go('workout')">${icon('check')}Exercice terminé</button><button class="btn btn-ghost-danger btn-block" onclick="cancelExercise()">Retirer l’exercice de la séance</button></div>`;
  return h;
}

/* ---------- Historique ---------- */
function details(i){detailIndex=i;go('details')}
function viewHistory(){
  let h=`<header class="page-head"><h1 class="title-xl">Historique</h1></header>`;
  if(!db.history.length)return h+`<div class="section empty"><b>Aucune séance terminée</b>Tes séances apparaîtront ici une fois terminées.</div>`;
  const now=new Date(),month=db.history.filter(s=>{const d=new Date(s.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).length;
  h+=`<div class="stats"><div class="stat"><b>${db.history.length}</b><span>Séances</span></div><div class="stat"><b>${month}</b><span>Ce mois-ci</span></div><div class="stat"><b>${num(db.history.reduce((n,s)=>n+setCount(s),0))}</b><span>Séries</span></div></div>`;
  let cur='',open=false;
  db.history.forEach((s,i)=>{
    const m=cap(new Date(s.date).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}));
    if(m!==cur){if(open)h+='</div></section>';h+=`<section class="section"><h2 class="section-title">${m}</h2><div class="list">`;cur=m;open=true}
    h+=sessionRow(s,i);
  });
  return h+'</div></section>';
}
function viewDetails(){
  const s=db.history[detailIndex];
  if(!s){go('history');return null}
  let h=navHead('Historique','history')+`<header class="page-head" style="--c:${progColor(s.type)}"><p class="eyebrow">${fmtDay(s.date)} · ${fmtTime(s.date)}</p><h1 class="title-xl tinted">${esc(s.type)}</h1></header>`;
  h+=`<div class="stats two"><div class="stat"><b>${s.end?elapsed(s.date,s.end):'—'}</b><span>Durée</span></div><div class="stat"><b>${num(volume(s))}<small>kg</small></b><span>Volume soulevé</span></div><div class="stat"><b>${exCount(s)}</b><span>Exercices</span></div><div class="stat"><b>${setCount(s)}</b><span>Séries</span></div></div>`;
  const entries=s.entries.filter(e=>e.sets.length);
  if(entries.length){
    h+=`<section class="section"><h2 class="section-title">Exercices</h2><div class="list">`;
    for(const e of entries){const u=units(e.group,e.name);h+=`<div class="ex-block"><div class="ex-head"><h3>${esc(e.name)}</h3><span>${esc(e.group)}</span></div><ol class="set-chips">${e.sets.map((v,j)=>`<li><span>${j+1}</span>${setTxt(v,u)}</li>`).join('')}</ol></div>`}
    h+='</div></section>';
  }else h+=`<div class="section empty"><b>Séance vide</b>Aucune série n’a été saisie.</div>`;
  h+=`<div class="actions"><button class="btn btn-ghost-danger btn-block" onclick="deleteSession(${detailIndex})">${icon('trash')}Supprimer cette séance</button></div>`;
  return h;
}
async function deleteSession(i){
  if(!await sheet({title:'Supprimer cette séance ?',text:'Elle disparaîtra de l’historique et des courbes de progression.',ok:'Supprimer',danger:true}))return;
  const [removed]=db.history.splice(i,1);save();go('history');
  toast('Séance supprimée','Annuler',()=>{db.history.splice(i,0,removed);save();render()});
}

/* ---------- Progression ---------- */
let progressPts=[],progressProg='Push';
function viewProgress(){
  let h=`<header class="page-head"><h1 class="title-xl">Progrès</h1></header>`;
  const done=new Set(db.history.flatMap(s=>(s.entries||[]).filter(e=>e.sets?.length).map(e=>key(e.group,e.name))));
  const opts=all().filter(x=>done.has(x.k));
  if(!opts.length){progressPts=[];return h+`<div class="section empty"><b>Pas encore de données</b>Termine une première séance pour suivre ta progression exercice par exercice.</div>`}
  if(!opts.some(x=>x.k===progressKey)){const first=db.history.flatMap(s=>s.entries).find(e=>e.sets?.length&&done.has(key(e.group,e.name)));progressKey=first&&opts.some(x=>x.k===key(first.group,first.name))?key(first.group,first.name):opts[0].k}
  const cur=opts.find(x=>x.k===progressKey),u=units(cur.g,cur.e);
  progressProg=cur.p;
  document.documentElement.style.setProperty('--c',progColor(cur.p));
  const byProg={};opts.forEach(x=>(byProg[x.p] ||= []).push(x));
  h+=`<div class="select-wrap"><label for="progress-ex" class="visually-hidden">Exercice</label><select id="progress-ex" class="select" onchange="progressKey=this.value;render()">${Object.entries(byProg).map(([p,xs])=>`<optgroup label="${esc(p==='Extras'?'Compléments':p)}">${xs.map(x=>`<option value="${esc(x.k)}"${x.k===progressKey?' selected':''}>${esc(x.e)} · ${esc(x.g)}</option>`).join('')}</optgroup>`).join('')}</select>${icon('next')}</div>`;
  progressPts=db.history.slice().reverse().map(s=>({date:s.date,sets:setsOf(s,cur.g,cur.e)})).filter(x=>x.sets.length).map(x=>({...x,v:Math.max(...x.sets.map(s=>Number(s.kg)||0))}));
  const vals=progressPts.map(p=>p.v),last=vals[vals.length-1],delta=last-vals[0];
  h+=`<div class="stats two"><div class="stat"><b>${num(Math.max(...vals))}<small>${u.a}</small></b><span>Record</span></div><div class="stat"><b>${num(last)}<small>${u.a}</small></b><span>Dernière séance</span></div><div class="stat"><b class="${vals.length>1?(delta>0?'up':delta<0?'down':''):''}">${vals.length>1?(delta>0?'+':'')+num(delta):'—'}<small>${vals.length>1?u.a:''}</small></b><span>Depuis le début</span></div><div class="stat"><b>${vals.length}</b><span>Séances</span></div></div>`;
  h+=`<div class="chart-card"><canvas id="chart" role="img" aria-label="${esc(u.metric)}"></canvas></div><p class="caption">${u.metric}</p>`;
  h+=`<section class="section"><h2 class="section-title">Séances</h2><div class="list">${progressPts.slice().reverse().map(p=>`<div class="row"><span class="row-main"><span class="row-title">${fmtDay(p.date)}</span><span class="row-sub">${plural(p.sets.length,'série')} · meilleure ${setTxt(best(p.sets),u)}</span></span><span class="row-value">${num(p.v)} ${u.a}</span></div>`).join('')}</div></section>`;
  return h;
}
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function niceStep(x){const e=Math.pow(10,Math.floor(Math.log10(x))),f=x/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function drawProgress(){
  const c=document.getElementById('chart');if(!c||!progressPts.length)return;
  const dpr=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);
  const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const col=cssVar(PROG_VAR[progressProg]||'--extra'),line=cssVar('--line'),t3=cssVar('--text-3'),t2=cssVar('--text-2'),bg=cssVar('--surface');
  const vals=progressPts.map(p=>p.v);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(hi===lo){const pad=Math.max(1,Math.abs(hi)*.1);lo-=pad;hi+=pad}
  const step=niceStep((hi-lo)/3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  if(lo<0&&Math.min(...vals)>=0)lo=0;
  const ticks=[];for(let v=lo;v<=hi+step/2;v+=step)ticks.push(+v.toFixed(6));
  ctx.font='500 12px Onest, system-ui, sans-serif';
  const L=Math.ceil(Math.max(...ticks.map(t=>ctx.measureText(num(t)).width)))+14,R=14,T=12,B=28;
  const x=i=>progressPts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(progressPts.length-1);
  const y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  ctx.textAlign='right';ctx.textBaseline='middle';
  ticks.forEach(t=>{const yy=Math.round(y(t))+.5;ctx.strokeStyle=line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(W-R,yy);ctx.stroke();ctx.fillStyle=t3;ctx.fillText(num(t),L-8,yy)});
  if(progressPts.length>1){
    const g=ctx.createLinearGradient(0,T,0,H-B);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');
    ctx.beginPath();vals.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.lineTo(x(vals.length-1),y(lo));ctx.lineTo(x(0),y(lo));ctx.closePath();ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();vals.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
  }
  if(vals.length<=40)vals.forEach((v,i)=>{if(i===vals.length-1)return;ctx.beginPath();ctx.arc(x(i),y(v),3,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke()});
  const lx=x(vals.length-1),ly=y(vals[vals.length-1]);
  ctx.beginPath();ctx.arc(lx,ly,8,0,Math.PI*2);ctx.fillStyle=col+'33';ctx.fill();
  ctx.beginPath();ctx.arc(lx,ly,4.5,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
  ctx.fillStyle=t2;ctx.textBaseline='alphabetic';
  if(progressPts.length===1){ctx.textAlign='center';ctx.fillText(fmtDate(progressPts[0].date),lx,H-8)}
  else{ctx.textAlign='left';ctx.fillText(fmtDate(progressPts[0].date),L,H-8);ctx.textAlign='right';ctx.fillText(fmtDate(progressPts[progressPts.length-1].date),W-R,H-8)}
}
window.addEventListener('resize',()=>{if(page==='progress')drawProgress()});
document.fonts?.ready.then(()=>{if(page==='progress')drawProgress()});

/* ---------- Données ---------- */
function viewSettings(){
  const exercises=all().length,first=db.history[db.history.length-1];
  let h=`<header class="page-head"><h1 class="title-xl">Données</h1></header>`;
  h+=`<section class="section"><div class="list"><div class="row"><span class="row-main"><span class="row-title">Séances enregistrées</span></span><span class="row-value">${db.history.length}</span></div><div class="row"><span class="row-main"><span class="row-title">Première séance</span></span><span class="row-side">${first?new Date(first.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'—'}</span></div><div class="row"><span class="row-main"><span class="row-title">Exercices disponibles</span></span><span class="row-value">${exercises}</span></div></div></section>`;
  h+=`<section class="section"><h2 class="section-title">Sauvegarde</h2><div class="actions" style="margin-top:0"><button class="btn btn-primary btn-block" onclick="exportData()">${icon('download')}Exporter ma sauvegarde</button><label class="btn btn-secondary btn-block" for="import-file">${icon('upload')}Importer une sauvegarde</label><input id="import-file" class="visually-hidden" type="file" accept="application/json,.json" onchange="importData(this.files[0]);this.value=''"></div><p class="note">Tout est enregistré automatiquement sur cet appareil, sans compte ni serveur. Exporte régulièrement une sauvegarde, surtout avant de changer de téléphone ou d’effacer les données du navigateur.</p></section>`;
  return h;
}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ma-salle-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Sauvegarde exportée')}
async function importData(f){
  if(!f)return;
  let d;try{d=JSON.parse(await f.text());if(!d.library||!Array.isArray(d.history))throw Error()}catch{return toast('Ce fichier n’est pas une sauvegarde Ma Salle valide.')}
  if(!await sheet({title:'Remplacer toutes les données ?',text:'La sauvegarde contient '+plural(d.history.length,'séance')+'. Les données actuelles de cet appareil seront écrasées.',ok:'Remplacer',danger:true}))return;
  db=normalize(d);save();go('home');toast('Sauvegarde importée');
}

/* ---------- Feuille de dialogue et toast ---------- */
function sheet({title,text='',ok='Confirmer',cancel='Annuler',danger=false,input=null}){
  return new Promise(resolve=>{
    const d=document.getElementById('sheet');
    d.innerHTML=`<form class="sheet-body" method="dialog"><h2 class="sheet-title">${esc(title)}</h2>${text?`<p class="sheet-text">${esc(text)}</p>`:''}${input!==null?`<input id="sheet-input" class="field" type="text" autocomplete="off" enterkeyhint="done" placeholder="${esc(input)}">`:''}<div class="sheet-actions"><button type="button" class="btn btn-secondary" data-cancel>${esc(cancel)}</button><button type="submit" class="btn ${danger?'btn-danger':'btn-primary'}">${esc(ok)}</button></div></form>`;
    const field=d.querySelector('#sheet-input');
    let done=false;
    const finish=v=>{if(done)return;done=true;if(d.open)d.close();resolve(input!==null?(v?field.value:null):v)};
    d.querySelector('form').onsubmit=e=>{e.preventDefault();finish(true)};
    d.querySelector('[data-cancel]').onclick=()=>finish(false);
    d.oncancel=e=>{e.preventDefault();finish(false)};
    d.onclick=e=>{if(e.target===d)finish(false)};
    d.showModal();
    (field||d.querySelector('[type=submit]')).focus();
  });
}
let toastTimer;
function toast(msg,action,fn){
  const t=document.getElementById('toast');
  t.innerHTML=`<span>${esc(msg)}</span>${action?`<button type="button">${esc(action)}</button>`:''}`;
  if(action)t.querySelector('button').onclick=()=>{t.hidden=true;fn()};
  t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},action?5000:2500);
}

render();
</script>
